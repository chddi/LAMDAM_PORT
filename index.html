<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lam Dam Portfolio</title>
<meta name="description" content="Lam Dam, photographer and art director based in Viet Nam. E-commerce, advertising, editorial and personal work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout concept: a photographer's contact sheet. Black ground, numbered frames, editorial slides per project. */
:root{
  --paper:#efede8; --ink:#1b1a18; --ink-2:#55524c; --line:rgba(27,26,24,.14);
  --night:#141312; --night-2:#1f1d1b; --bone:#efede8; --bone-line:rgba(239,237,232,.18);
  --wine:#4b1714;
  --gut:clamp(16px,3.2vw,48px);
  --head:"Inter Tight","Helvetica Neue",Arial,sans-serif; --body:"Inter","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:51px}
body{background:var(--night);color:var(--bone);font-family:var(--body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
::selection{background:var(--wine);color:var(--bone)}

.label{font-family:var(--head);font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.muted{opacity:.55}
.h-sec{font-family:var(--head);font-weight:600;font-size:clamp(20px,2vw,28px);letter-spacing:-.01em;display:flex;gap:.9em;align-items:baseline;text-wrap:balance}
.h-sec .num{min-width:2.4em;font-variant-numeric:tabular-nums}

/* nav */
.nav{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:calc(14px + env(safe-area-inset-top,0px)) var(--gut) 14px;color:var(--bone);background:var(--night);border-bottom:1px solid var(--bone-line)}
.nav .brand{font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.nav ul{display:flex;gap:clamp(10px,2vw,28px);list-style:none}
.nav ul a{font-family:var(--head);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;opacity:.85;white-space:nowrap}
.nav ul a:hover,.nav ul a[aria-current=page]{opacity:1;text-decoration:underline;text-underline-offset:4px}
@media (max-width:760px){.nav{flex-wrap:wrap;gap:6px 16px}.nav ul{width:100%;flex-wrap:wrap;gap:2px 12px}.nav ul a{font-size:9.5px;letter-spacing:.05em}}

/* landing hero */
.hero{position:relative;height:clamp(520px,84svh,920px);overflow:hidden;background:#000;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(20px,3vw,40px) var(--gut) 22px}
.hero>img{position:absolute;left:0;top:0;height:100%;width:auto;max-width:none;-webkit-mask-image:linear-gradient(to right,#000 78%,transparent);mask-image:linear-gradient(to right,#000 78%,transparent)}
.hero>*:not(img){position:relative}
.hero h1{font-family:var(--head);font-weight:700;font-size:clamp(60px,10.6vw,200px);line-height:.82;letter-spacing:-.05em;text-transform:uppercase;white-space:nowrap;text-align:right}
.hero-band{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:16px 24px;align-items:end;border-top:1px solid rgba(239,237,232,.35);padding-top:12px}
.hero-band p{font-family:var(--head);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1.5}
.hero-band p span{display:block;opacity:.6;font-weight:500}
.hero-band a{font-family:var(--head);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;border-bottom:1px solid currentColor;padding-bottom:2px}
@media (max-width:760px){html{scroll-padding-top:101px}.hero{padding-top:20px}.hero>img{top:auto;bottom:185px;width:100%;height:auto;-webkit-mask-image:none;mask-image:none}.hero h1{font-size:21vw;text-align:left}.hero-band{grid-template-columns:1fr 1fr;background:#000}}

/* highlights */
.top{padding:clamp(48px,6vw,88px) var(--gut) clamp(48px,6vw,88px);background:var(--night)}
.top-head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:clamp(24px,3vw,40px)}
.top-head h2{font-family:var(--head);font-weight:700;text-transform:uppercase;font-size:clamp(34px,5.4vw,88px);line-height:.9;letter-spacing:-.035em}
.t-rows{display:flex;flex-direction:column;gap:clamp(20px,2.4vw,34px)}
.t-row{display:flex;gap:clamp(8px,1vw,14px)}
.t{display:flex;flex-direction:column;gap:9px;min-width:0}
.t-img{overflow:hidden;background:var(--night-2);width:100%}
.t-img img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.7,.1,1)}
.t:hover .t-img img{transform:scale(1.025)}
.t-cap{display:grid;grid-template-columns:2.2em 1fr;gap:4px;font-family:var(--head);align-items:baseline}
.t-cap b{font-size:11px;font-weight:600;opacity:.6;font-variant-numeric:tabular-nums}
.t-cap span{font-weight:600;font-size:clamp(14px,1.25vw,18px);letter-spacing:-.005em;line-height:1.2}
.t-cap small{grid-column:2;font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;opacity:.55}
@media (max-width:720px){.t-row{flex-direction:column}.t{flex:none!important}}

/* slides */
.slide{position:relative;padding:clamp(72px,8vw,112px) var(--gut) 58px}
.slide.light{background:var(--paper);color:var(--ink)}
.slide.dark{background:var(--night-2);color:var(--bone)}
.slide.wine{background:var(--wine);color:var(--bone)}
.foot{position:absolute;left:var(--gut);right:var(--gut);bottom:18px;display:flex;gap:clamp(24px,6vw,96px)}
.foot .label{font-size:9px;opacity:.6}
.foot .label:last-child{margin-left:auto}

/* category entry */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1vw,14px);margin-top:clamp(24px,3vw,40px)}
.cat{display:flex;flex-direction:column;gap:10px}
.cat-img{aspect-ratio:4/5;overflow:hidden;background:var(--night)}
.cat-img img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.7,.1,1)}
.cat:hover .cat-img img{transform:scale(1.03)}
.cat h3{font-family:var(--head);font-weight:600;font-size:clamp(16px,1.6vw,22px);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
@media (max-width:720px){.cats{grid-template-columns:1fr 1fr}}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:clamp(24px,4vw,64px);margin-top:clamp(24px,3vw,40px);align-items:start}
.about img{width:100%;aspect-ratio:1;object-fit:cover}
.about-text p{font-family:var(--head);font-size:clamp(16px,1.5vw,21px);line-height:1.38;letter-spacing:-.005em;max-width:42em}
.about-text p+p{margin-top:1em}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
.facts dd{font-family:var(--head);font-weight:600;font-size:13px;margin-top:2px}
.lists{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);margin-top:clamp(36px,5vw,64px)}
.lists h3{font:600 10px/1.4 var(--head);letter-spacing:.09em;text-transform:uppercase;opacity:.55;padding-bottom:10px;border-bottom:1px solid var(--line)}
.lists ul{list-style:none}
.lists li{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-family:var(--head);font-weight:500;font-size:14px}
.lists li em{font-style:normal;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;opacity:.55;text-align:right;padding-top:3px}
.clients{display:grid;grid-template-columns:1fr 1fr;column-gap:20px}
.clients li{font-weight:600;font-size:12px;letter-spacing:.03em;text-transform:uppercase}
@media (max-width:820px){.about,.lists{grid-template-columns:1fr}.about img{max-width:320px}.facts{grid-template-columns:1fr 1fr}}

/* contact */
.big{font-family:var(--head);font-weight:700;text-transform:uppercase;font-size:clamp(38px,7.4vw,124px);line-height:.9;letter-spacing:-.04em;margin:clamp(28px,4vw,56px) 0}
.big a{border-bottom:.05em solid currentColor}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;border-top:1px solid var(--bone-line);padding-top:14px}
.cgrid a,.cgrid span.v{font-family:var(--head);font-weight:600;font-size:13px;overflow-wrap:anywhere}
@media (max-width:720px){.cgrid{grid-template-columns:1fr}}

/* category view */
.chapter{padding:clamp(44px,6vw,88px) var(--gut) clamp(32px,4vw,56px);background:var(--night)}
.chapter h1{font-family:var(--head);font-weight:700;text-transform:uppercase;font-size:clamp(46px,10vw,168px);line-height:.86;letter-spacing:-.045em;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.chips a{font:600 10px/1 var(--head);letter-spacing:.07em;text-transform:uppercase;padding:8px 11px;border:1px solid var(--bone-line);border-radius:999px}
.chips a:hover{background:var(--bone);color:var(--night)}
.chips a.top10{border-color:var(--bone)}

/* project */
.proj-head{display:grid;grid-template-columns:1.25fr 1fr;gap:var(--gut);align-items:start;margin-bottom:clamp(24px,3vw,44px)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
.meta div{display:grid;grid-template-columns:72px 1fr;gap:8px}
.meta dt,.meta dd{font:600 9px/1.6 var(--head);letter-spacing:.09em;text-transform:uppercase}
.meta dt{opacity:.5}
@media (max-width:820px){.proj-head{grid-template-columns:1fr}}
.rows{display:flex;flex-direction:column;gap:clamp(6px,.7vw,10px)}
.row{display:flex;gap:clamp(6px,.7vw,10px)}
.row figure{position:relative;overflow:hidden;background:rgba(127,127,127,.12);cursor:zoom-in;min-width:0}
.row img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.7,.1,1)}
.row figure:hover img{transform:scale(1.025)}
@media (max-width:720px){
  .row{flex-wrap:wrap;align-items:flex-start}
  .row figure{flex:0 0 calc(50% - 4px)!important}
  .row figure:only-child,.row figure:last-child:nth-child(odd){flex-basis:100%!important}
}
.ptext{display:grid;grid-template-columns:1fr 2fr;gap:var(--gut);margin-top:28px;border-top:1px solid var(--bone-line);padding-top:14px}
.ptext p{max-width:68ch;font-size:13px;opacity:.8}
.ptext p+p{margin-top:1em}
@media (max-width:820px){.ptext{grid-template-columns:1fr;gap:10px}}
.pager{display:grid;grid-template-columns:1fr 1fr;background:var(--night);border-top:1px solid var(--bone-line)}
.pager a{padding:22px var(--gut);font-family:var(--head);font-weight:600;font-size:clamp(15px,1.6vw,22px);display:flex;flex-direction:column;gap:4px}
.pager a+a{text-align:right;border-left:1px solid var(--bone-line)}
.pager a:hover{background:var(--night-2)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(14,13,12,.97);color:var(--bone);display:none;grid-template-rows:auto minmax(0,1fr) auto}
.lb.open{display:grid}
.lb-top,.lb-bot{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) var(--gut) 12px}
.lb-stage{display:flex;align-items:center;justify-content:center;min-height:0;padding:0 var(--gut)}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{background:none;border:0;color:inherit;font:600 11px/1 var(--head);letter-spacing:.09em;text-transform:uppercase;cursor:pointer;padding:10px 4px}
.lb button:hover{opacity:.6}
@media (prefers-reduced-motion:reduce){.t-img img,.cat-img img,.row img{transition:none}}

/* marquee */
.mq{overflow:hidden;background:var(--night);border-block:1px solid var(--bone-line);padding:clamp(14px,1.8vw,26px) 0}
.mq-track{display:flex;width:max-content}
.mq-track div{display:flex;flex:none}
.mq span{font-family:var(--head);font-weight:700;text-transform:uppercase;font-size:clamp(34px,6vw,96px);line-height:1;letter-spacing:-.035em;white-space:nowrap;padding-right:.55em}
.mq span:nth-child(even){opacity:.32}
@keyframes mq{to{transform:translateX(-50%)}}
html.motion .mq-track{animation:mq 46s linear infinite}
.mq:hover .mq-track{animation-play-state:paused}

/* motion: everything hidden here is only hidden once the script has set html.motion */
html{--ease:cubic-bezier(.16,.84,.24,1)}
.t-img,.cat-img{position:relative}
html.motion .rv-up{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease) var(--d,0s),transform 1.1s var(--ease) var(--d,0s)}
html.motion .rv-up.in{opacity:1;transform:none}
html.motion .rv-img{--cover:var(--night)}
html.motion .slide.dark .rv-img{--cover:var(--night-2)}
html.motion .slide.light .rv-img{--cover:var(--paper)}
html.motion .slide.wine .rv-img{--cover:var(--wine)}
html.motion .rv-img::after{content:"";position:absolute;inset:0;z-index:1;background:var(--cover);transform-origin:top;pointer-events:none;transition:transform 1.05s var(--ease) var(--d,0s)}
html.motion .rv-img.in::after{transform:scaleY(0)}
html.motion .rv-img img{scale:1.16;transition:scale 1.7s var(--ease) var(--d,0s),transform 1.1s cubic-bezier(.2,.7,.1,1)}
html.motion .rv-img.in img{scale:1}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.06em .05em .03em;margin:-.06em -.05em -.03em}
.wi{display:inline-block}
html.motion .wi{transform:translateY(112%);transition:transform 1.05s var(--ease);transition-delay:calc(var(--d,0s) + var(--i,0)*38ms)}
html.motion .in .wi{transform:none}
html.motion .hero>img{opacity:0;scale:1.08;transition:opacity 1.3s ease,scale 2.4s var(--ease)}
html.motion .hero.in>img{opacity:1;scale:1}
html.motion .hero-band{border-top-color:transparent;transition:border-color 1s ease .7s}
html.motion .hero.in .hero-band{border-top-color:rgba(239,237,232,.35)}
html.motion .hero-band>*{opacity:0;transform:translateY(14px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
html.motion .hero.in .hero-band>*{opacity:1;transform:none}
html.motion .hero.in .hero-band>:nth-child(1){transition-delay:.55s}
html.motion .hero.in .hero-band>:nth-child(2){transition-delay:.63s}
html.motion .hero.in .hero-band>:nth-child(3){transition-delay:.71s}
html.motion .hero.in .hero-band>:nth-child(4){transition-delay:.79s}
html.motion .nav{transition:transform .4s var(--ease)}
html.motion .nav.hide{transform:translateY(-100%)}
html.motion .nav::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--bone);transform:scaleX(var(--p,0));transform-origin:left}
@media (hover:hover){
  .t{transition:opacity .5s ease}
  .t-rows:hover .t:not(:hover){opacity:.42}
  .t-cap span{transition:transform .6s var(--ease)}
  .t:hover .t-cap span{transform:translateX(6px)}
  .t:hover .t-img img{transform:scale(1.045)}
  .cat:hover .cat-img img{transform:scale(1.05)}
}
/* highlights: covers drift inside their frames, a live counter rides along */
html.motion .t-img img{position:absolute;left:0;top:-6%;height:112%;will-change:translate}
.t-cap{position:relative;padding-top:8px}
.t-cap::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--bone-line)}
html.motion .t-cap::before{transform:scaleX(0);transform-origin:left;transition:transform 1.3s var(--ease) calc(var(--d,0s) + .15s)}
html.motion .t-cap.in::before{transform:none}
.t-cap::after{content:"→";position:absolute;right:0;top:8px;font-size:15px;line-height:1.2;opacity:0;transform:translateX(-10px);transition:opacity .4s ease,transform .6s var(--ease)}
.t:hover .t-cap::after,.t:focus-visible .t-cap::after{opacity:1;transform:none}
.hl-now{display:none}
html.motion .hl-now{display:flex;align-items:baseline;gap:7px;position:sticky;bottom:16px;z-index:3;width:fit-content;max-width:100%;margin-top:18px;padding:9px 14px;border-radius:999px;background:var(--bone);color:var(--night);font:600 11px/1.2 var(--head);pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity .4s ease,transform .6s var(--ease)}
html.motion .hl-now.on{opacity:1;transform:none}
.hl-now b{font-weight:700;font-variant-numeric:tabular-nums}
.hl-now i{font-style:normal;opacity:.5;font-variant-numeric:tabular-nums}
.hl-now span{margin-left:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wipe{position:fixed;inset:0;z-index:90;background:var(--wine);color:var(--bone);display:flex;align-items:flex-end;padding:var(--gut);transform:translateY(100%);visibility:hidden;pointer-events:none}
.wipe span{font-family:var(--head);font-weight:700;text-transform:uppercase;font-size:clamp(38px,8vw,136px);line-height:.9;letter-spacing:-.04em}
.chip{position:fixed;left:0;top:0;z-index:60;pointer-events:none;will-change:transform}
.chip span{display:flex;align-items:center;justify-content:center;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:var(--bone);color:var(--night);font:600 10px/1 var(--head);letter-spacing:.09em;text-transform:uppercase;transform:scale(0);transition:transform .35s var(--ease)}
.chip.on span{transform:scale(1)}
@keyframes lbin{from{opacity:0}}
html.motion .lb.open{animation:lbin .3s ease}
html.motion .lb-stage img{animation:lbin .45s ease}
</style>
</head>
<body>

<nav class="nav" aria-label="Main">
  <a class="brand" href="#top">Lam Dam</a>
  <ul>
    <li><a href="#top">Homepage</a></li>
    <li><a href="#ecommerce">E‑Commerce</a></li>
    <li><a href="#advertising">Advertising</a></li>
    <li><a href="#editorial">Editorial</a></li>
    <li><a href="#personal">Personal</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<div id="view"></div>
<div class="wipe" id="wipe" aria-hidden="true"><span></span></div>
<div class="chip" id="chip" aria-hidden="true"><span></span></div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="lb-top"><span class="label" id="lb-title"></span><button id="lb-close">Close ✕</button></div>
  <div class="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-bot"><button id="lb-prev">← Prev</button><span class="label" id="lb-count"></span><button id="lb-next">Next →</button></div>
</div>

<script src="dims.js"></script>
<script>
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
// image helpers: H = high-res folder set, P = every crop from a PDF page, W = numbered web set
const H = (s, a, b) => { const o = []; for (let i = a; i <= b; i++) o.push(`h-${s}-${pad(i)}`); return o; };
const W = (s, a, b) => { const o = []; for (let i = a; i <= b; i++) o.push(`w-${s}-${pad(i)}`); return o; };
const P = pg => Object.keys(DIMS).filter(k => k.startsWith(pg + '-')).sort();
const ar = k => DIMS[k][0] / DIMS[k][1];

const CATS = {
  e:{id:'ecommerce', title:'E‑Commerce', label:'E-Commerce', cover:'h-ppmecom-02', pos:'50% 50%'},
  a:{id:'advertising', title:'Advertising', label:'Advertising', cover:'h-heritage-04', pos:'50% 30%'},
  d:{id:'editorial', title:'Editorial', label:'Editorial', cover:'h-mob-02', pos:'50% 20%'},
  p:{id:'personal', title:'Personal', label:'Personal', cover:'w-cs-05', pos:'50% 30%'},
};

// Highlights, in the order given by Lam
const TOP = [
  {title:'Linen Chest', cat:'e', disc:'Home & Lifestyle', cover:'p04-05', theme:'light', imgs:P('p04')},
  {title:'Studio Rybko Still Life', cat:'e', disc:'Jewelry · Still Life', year:'2025', cover:'h-rybkostill-09', theme:'light', imgs:H('rybkostill',1,16)},
  {title:'Studio Rybko Launch Campaign', cat:'a', disc:'Advertising · Jewelry', year:'2025', cover:'h-rybkolaunch-02', theme:'wine', imgs:H('rybkolaunch',1,12)},
  {title:'Désolé Magazine', cat:'d', disc:'Editorial', note:'Canada 2025', cover:'h-desole-07', theme:'dark', imgs:H('desole',1,15)},
  {title:'Creature Atelier', cat:'a', disc:'Campaign · ESSAI ERREUR Collection', cover:'h-creature-03', theme:'wine', imgs:[...H('creature',1,5),'p30-04','p30-06']},
  {title:'Kazarj Magazine', cat:'d', disc:'Editorial', note:'USA 2024', cover:'h-kazarj-03', theme:'dark', imgs:H('kazarj',1,5)},

function split(el, chars) {
  const walk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
  while (walk.nextNode()) nodes.push(walk.currentNode);
  let i = 0;
  nodes.forEach(n => {
    const f = document.createDocumentFragment();
    n.textContent.split(/(\s+)/).forEach(tok => {
      if (!tok.trim()) { if (tok) f.append(' '); return; }
      const w = document.createElement('span'); w.className = 'w';
      (chars ? [...tok] : [tok]).forEach(s => {
        const c = document.createElement('span'); c.className = 'wi'; c.textContent = s;
        c.style.setProperty('--i', i++); w.append(c);
      });
      f.append(w);
    });
    n.replaceWith(f);
  });
}
function arm() {
  scrollTick();
  if (!MOTION) return;
  const targets = [];
  const mark = (sel, cls) => view.querySelectorAll(sel).forEach(el => { if (cls) el.classList.add(cls); targets.push(el); });
  view.querySelectorAll('.hero h1,.chapter h1').forEach(el => { el.setAttribute('aria-label', el.textContent); split(el, true); });
  view.querySelectorAll('.top-head h2,.big').forEach(el => split(el, false));

  mark('.t-img,.cat-img,.row figure', 'rv-img');

  // start after the page wipe has begun lifting, so entrances aren't spent behind it
  // what's already on screen starts now rather than waiting on the observer's first frame
  setTimeout(() => {
    let n = 0;
    targets.forEach(el => {
      const r = el.getBoundingClientRect();

}

const nav = document.querySelector('.nav');

function scrollTick() {

  if (innerWidth > 760) nav.classList.remove('hide');

  if (hi && y < innerHeight * 1.2) { hi.style.transform = `translateY(${y * .14}px)`; hh.style.transform = `translateY(${y * .3}px)`; }
  highlightsTick();
}
let hlCur = 0;
function highlightsTick() {
  const sec = view.querySelector('.top'); if (!sec) return;
  const box = sec.getBoundingClientRect(), vh = innerHeight;
  if (box.bottom < 0 || box.top > vh) return;
  const h2 = sec.querySelector('.top-head h2');
  h2.style.translate = `${Math.min(Math.max(box.top, 0) / vh, 1) * 9}vw 0`;
  sec.querySelectorAll('.t-img').forEach(f => {
    const r = f.getBoundingClientRect();
    if (r.bottom < 0 || r.top > vh) return;
    const n = Math.max(-1, Math.min(1, (r.top + r.height / 2 - vh / 2) / (vh / 2 + r.height / 2)));
    f.firstElementChild.style.translate = `0 ${(-n * 5).toFixed(2)}%`;
  });
  // walk the items of whichever row crosses mid-screen, so side-by-side projects each get a turn
  const mid = vh * .55, now = sec.querySelector('.hl-now'), rows = [...sec.querySelectorAll('.t-row')];
  const row = rows.find(r => r.getBoundingClientRect().bottom >= mid);
  const rb = sec.querySelector('.t-rows').getBoundingClientRect();
  now.classList.toggle('on', rb.top < mid && rb.bottom > vh * .35);
  if (!row) return;
  const rr = row.getBoundingClientRect(), items = [...row.children];
  const stacked = items.length > 1 && items[0].getBoundingClientRect().bottom <= items[1].getBoundingClientRect().top;
  const it = stacked ? items.find(t => t.getBoundingClientRect().bottom >= mid) || items[items.length - 1]
    : items[Math.min(items.length - 1, Math.floor(Math.max(0, (mid - rr.top) / rr.height) * items.length))];
  const i = [...sec.querySelectorAll('.t')].indexOf(it);
  if (i === hlCur) return;
  const up = i > hlCur; hlCur = i;
  now.querySelector('b').textContent = pad(i + 1);
  const s = now.querySelector('span');
  s.textContent = it.querySelector('.t-cap span').textContent;
  [now.querySelector('b'), s].forEach(el => el.animate && el.animate(
    [{opacity:0, transform:`translateY(${up ? 8 : -8}px)`}, {opacity:1, transform:'none'}],
    {duration:380, easing:'cubic-bezier(.16,.84,.24,1)'}));
}

const titleOf = t => { const c = Object.values(CATS).find(x => x.id === t), p = ALL.find(x => x.id === t); return c ? c.title : p ? p.title : 'Lam Dam'; };
const slide = (from, to, ms) => Promise.race([
  wipe.animate([{transform:from},{transform:to}], {duration:ms, easing:'cubic-bezier(.76,0,.24,1)', fill:'forwards'}).finished,
  new Promise(r => setTimeout(r, ms + 120))
]);
function route(hash) {
  const t = (hash || '').replace(/^#/, '');
  if (wiping) { pending = hash; return; }
  if (!MOTION || shown === null || keyOf(t) === shown) return go(hash);
  wiping = true;
  wipe.firstElementChild.textContent = titleOf(t);
  wipe.style.visibility = 'visible';
  slide('translateY(100%)', 'translateY(0)', 460).then(() => {
    go(hash);
    return slide('translateY(0)', 'translateY(-100%)', 520);
  }).then(() => {
    wipe.style.visibility = 'hidden'; wiping = false;
    if (pending !== null) { const h = pending; pending = null; route(h); }
  });
}

// cursor chip over anything that opens
const chip = document.getElementById('chip');
if (MOTION && matchMedia('(hover:hover) and (pointer:fine)').matches) {
  let tx = 0, ty = 0, x = 0, y = 0, raf = 0;
  const step = () => {
    x += (tx - x) * .2; y += (ty - y) * .2;
    chip.style.transform = `translate(${x}px,${y}px)`;
    raf = Math.abs(tx - x) + Math.abs(ty - y) > .4 ? requestAnimationFrame(step) : 0;
  };
  addEventListener('mousemove', e => {
    tx = e.clientX; ty = e.clientY;
    const hit = e.target.closest && e.target.closest('.t-img,.cat-img,figure[data-i]');
    if (hit && !chip.classList.contains('on')) { x = tx; y = ty; }
    chip.classList.toggle('on', !!hit);
    if (hit) chip.firstElementChild.textContent = hit.matches('figure') ? 'Zoom' : 'View';
    if (!raf) raf = requestAnimationFrame(step);
  }, {passive:true});
  addEventListener('click', () => chip.classList.remove('on'), true);

}

function go(hash) {
  const t = (hash || '').replace(/^#/, '');
  const cat = Object.keys(CATS).find(k => CATS[k].id === t);
  const proj = ALL.find(p => p.id === t);
  if (cat) { render(t, () => catView(cat)); scrollTo({top:0, behavior:'instant'}); }
  else if (proj) { render(t, () => projectView(proj)); scrollTo({top:0, behavior:'instant'}); }
  else {
    const fromElsewhere = shown !== 'home';
    render('home', homeView);
    const el = t && t !== 'top' && HOME_ANCHORS.includes(t) && document.getElementById(t);
    if (el) el.scrollIntoView({behavior: fromElsewhere ? 'instant' : 'smooth'});
    else scrollTo({top:0, behavior: fromElsewhere ? 'instant' : 'smooth'});
  }
  document.querySelectorAll('.nav ul a').forEach(a => {
    const on = a.getAttribute('href') === '#' + t || (proj && a.getAttribute('href') === '#' + CATS[proj.cat].id);
    if (on) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (a) { e.preventDefault(); const h = a.getAttribute('href'); try { history.pushState(null, '', h); } catch (_) {} route(h); return; }
  const f = e.target.closest('figure[data-i]');
  if (f) { show(+f.dataset.i); lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
});
addEventListener('popstate', () => route(location.hash));
addEventListener('hashchange', () => route(location.hash));

// ---- lightbox ----
const lb = document.getElementById('lb'), lbImg = document.getElementById('lb-img');
function show(i) {
  cur = (i + shots.length) % shots.length;
  lbImg.src = shots[cur].src; lbImg.alt = shots[cur].title;
  document.getElementById('lb-title').textContent = shots[cur].title;
  document.getElementById('lb-count').textContent = `${pad(cur + 1)} / ${pad(shots.length)}`;
}
const closeLb = () => { lb.classList.remove('open'); document.body.style.overflow = ''; };
document.getElementById('lb-close').onclick = closeLb;
document.getElementById('lb-prev').onclick = () => show(cur - 1);
document.getElementById('lb-next').onclick = () => show(cur + 1);
lb.addEventListener('click', e => { if (e.target.classList.contains('lb-stage')) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowLeft') show(cur - 1); if (e.key === 'ArrowRight') show(cur + 1);
});

route(location.hash);
</script>
</body>
